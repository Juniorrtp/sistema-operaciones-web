<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Operaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #1a2a3a;
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">🔐</div>
    <h2>Sistema de Operaciones</h2>
    
    <form id="loginForm" onsubmit="event.preventDefault(); login();">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" placeholder="Usuario" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div id="errorMsg" class="text-danger text-center mb-3" style="display:none;"></div>
        
        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
    </form>
    
    <div class="text-center mt-3">
        <small class="text-muted">Sistema de Operaciones</small>
    </div>
</div>

<script>
    // URL de la API
    const API_URL = window.location.hostname === 'localhost' 
        ? 'http://localhost:8000/api' 
        : 'https://sistema-operaciones-web.onrender.com/api';

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        
        errorMsg.style.display = 'none';
        errorMsg.textContent = '';

        try {
            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password }),
                credentials: 'include'  // ✅ Importante para guardar cookies
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || 'Error al iniciar sesión');
            }

            // ✅ Redirigir al dashboard
            window.location.href = '/';

        } catch (error) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = '❌ ' + error.message;
        }
    }
</script>

</body>
</html>
