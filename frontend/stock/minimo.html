<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Mínimo</title>
</head>
<body>
    <h1>🔧 Test de Conexión</h1>
    <button onclick="test()">Probar API</button>
    <pre id="resultado">Presiona el botón</pre>

    <script>
        async function test() {
            document.getElementById('resultado').textContent = 'Cargando...';
            try {
                const res = await fetch('http://localhost:8000/api/stock');
                const data = await res.json();
                document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('resultado').textContent = '❌ Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
